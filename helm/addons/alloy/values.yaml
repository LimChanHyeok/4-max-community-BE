# Alloy Helm Chart 1.11.0
# Alloy Application v1.18.0

# PodLogs 같은 Grafana 전용 CRD는 사용하지 않음
crds:
  create: false

alloy:
  # DaemonSet의 각 Alloy가 자기 노드 로그를 독립적으로 수집
  clustering:
    enabled: false

  # 로그 파일을 어디까지 읽었는지 저장하는 위치
  storagePath: /var/lib/alloy

  # Grafana Labs 익명 사용 통계 비활성화
  enableReporting: false

  # Alloy 로그 수집 파이프라인
  configMap:
    create: true
    content: |-
      // community-prod-backend Namespace의 Backend Pod 발견
      discovery.kubernetes "community_backend" {
        role = "pod"

        namespaces {
          names = ["community-prod-backend"]
        }

        // 현재 Alloy와 같은 Worker Node의 Backend Pod만 발견
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
          label = "app=community,tier=backend,env=prod"
        }
      }

      // Kubernetes 메타데이터를 Loki용 라벨과 파일 경로로 변환
      discovery.relabel "community_backend" {
        targets = discovery.kubernetes.community_backend.targets

        // Namespace
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
          action        = "replace"
        }

        // 실행 환경
        rule {
          source_labels = ["__meta_kubernetes_pod_label_env"]
          target_label  = "env"
          action        = "replace"
        }

        // 클러스터 이름
        rule {
          target_label = "cluster"
          replacement  = "community-k8s"
          action       = "replace"
        }

        // service_name 기본값
        rule {
          target_label = "service_name"
          replacement  = "community-backend"
          action       = "replace"
        }

        // app.kubernetes.io/name이 존재하면 service_name으로 사용
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "service_name"
          regex         = "(.+)"
          replacement   = "$1"
          action        = "replace"
        }

        // 이후 Kubernetes Event 및 Node 로그와 구분하기 위한 출처
        rule {
          target_label = "source_type"
          replacement  = "kubernetes_pod"
          action       = "replace"
        }

        // 아래 값들은 잠시 라벨로 만든 뒤
        // loki.process에서 Structured Metadata로 이동
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
          action        = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_uid"]
          target_label  = "pod_uid"
          action        = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
          action        = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
          action        = "replace"
        }

        // containerd가 저장한 실제 Pod 로그 파일 경로 생성
        rule {
          source_labels = [
            "__meta_kubernetes_pod_uid",
            "__meta_kubernetes_pod_container_name",
          ]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
          action        = "replace"
        }
      }

      // __path__ 패턴에 해당하는 실제 로그 파일 탐색
      local.file_match "community_backend" {
        path_targets = discovery.relabel.community_backend.output
      }

      // Worker Node의 Backend 로그 파일 읽기
      loki.source.file "community_backend" {
        targets    = local.file_match.community_backend.targets
        forward_to = [loki.process.community_backend.receiver]
      }

      // containerd CRI 로그 형식 처리
      loki.process "community_backend" {
        forward_to = [loki.write.local.receiver]

        // CRI 로그에서 timestamp, stream, content 분리
        stage.cri {}

        // 자주 바뀌는 정보는 인덱스 라벨이 아닌
        // Structured Metadata로 저장
        stage.structured_metadata {
          values = {
            pod       = "",
            pod_uid   = "",
            container = "",
            node      = "",
            stream    = "",
            filename  = "",
          }
        }

        // CRI 접두사를 제외한 애플리케이션 로그만 본문으로 사용
        stage.output {
          source = "content"
        }
      }

      // 처리된 로그를 Loki Gateway로 전송
      loki.write "local" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

  # Worker Node의 /var/log를 Alloy 컨테이너에 마운트
  mounts:
    varlog: true

    # 로그 읽기 위치 저장 디렉터리 마운트
    extra:
      - name: alloy-storage
        mountPath: /var/lib/alloy

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

# ConfigMap 변경 시 Alloy 설정 자동 Reload
configReloader:
  enabled: true

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# 각 Worker Node에 Alloy 하나씩 실행
controller:
  type: daemonset

  podDisruptionBudget:
    enabled: false

  # Control Plane을 제외하고 Worker에만 배치
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  # 로그를 어디까지 읽었는지 Worker 로컬 디스크에 저장
  volumes:
    extra:
      - name: alloy-storage
        hostPath:
          path: /var/lib/alloy
          type: DirectoryOrCreate

# Backend Namespace의 Pod 조회 권한만 부여
rbac:
  create: true

  namespaces:
    - community-prod-backend

  rules:
    - apiGroups:
        - ""
      resources:
        - pods
      verbs:
        - get
        - list
        - watch

  clusterRules: []

serviceAccount:
  create: true

# Alloy 자체 메트릭을 기존 Prometheus가 수집
serviceMonitor:
  enabled: true
  interval: 30s