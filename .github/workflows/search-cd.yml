name: Search CD

on:
  workflow_call:
    inputs:
      backend_sha:
        description: "ECR에 발행된 백엔드 커밋 SHA"
        required: true
        type: string

permissions: {}

concurrency:
  group: community-search-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'LimChanHyeok/4-max-community-BE' && github.ref == 'refs/heads/search-enhancement' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      BACKEND_SHA: ${{ inputs.backend_sha }}
    steps:
      - name: Validate backend version
        shell: bash
        run: |
          if [[ ! "$BACKEND_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "백엔드 커밋 SHA는 소문자 16진수 40자여야 합니다."
            exit 1
          fi

      - name: Get AWS credentials for search deployment
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::929368845727:role/community-search-cd-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 1800

      - name: Deploy verified image through SSM
        shell: bash
        run: |
          set -euo pipefail
          for server in backend mysql; do
            servers=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=community-search-$server" "Name=instance-state-name,Values=pending,running,stopping,stopped")
            count=$(jq '[.Reservations[].Instances[]] | length' <<< "$servers")
            if [[ "$count" != 1 ]]; then
              echo "community-search-$server 인스턴스를 하나로 확인할 수 없습니다." >&2
              exit 1
            fi
            instance=$(jq -r '.Reservations[].Instances[].InstanceId' <<< "$servers")
            state=$(jq -r '.Reservations[].Instances[].State.Name' <<< "$servers")
            if [[ "$state" != running ]]; then
              echo "- 서버가 $state 상태여서 배포를 건너뛰었습니다. 서버를 켠 뒤 이 실행을 재실행하세요." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            ping=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$instance" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            if [[ "$ping" != Online ]]; then
              echo "community-search-$server 서버의 SSM 연결이 준비되지 않았습니다." >&2
              exit 1
            fi
            if [[ "$server" == backend ]]; then
              backend_instance="$instance"
            fi
          done

          digest=$(aws ecr describe-images --repository-name community-search-backend \
            --image-ids "imageTag=$BACKEND_SHA" --query 'imageDetails[0].imageDigest' --output text)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ECR에서 지정한 커밋의 이미지 다이제스트를 확인할 수 없습니다." >&2
            exit 1
          fi

          parameters=$(jq -cn --arg digest "$digest" '{ImageDigest: [$digest]}')
          command_id=$(aws ssm send-command --instance-ids "$backend_instance" \
            --document-name community-search-deploy --document-version '$LATEST' \
            --parameters "$parameters" --timeout-seconds 60 \
            --query 'Command.CommandId' --output text)

          {
            echo '### Search 배포'
            printf -- '- 백엔드 커밋 `%s`\n' "$BACKEND_SHA"
            printf -- '- ECR 다이제스트 `%s`\n' "$digest"
            printf -- '- SSM 명령 `%s`\n' "$command_id"
          } >> "$GITHUB_STEP_SUMMARY"

          for ((attempt=0; attempt<190; attempt++)); do
            if invocation=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$backend_instance" 2>&1); then
              status=$(jq -r '.Status' <<< "$invocation")
              case "$status" in
                Pending|InProgress|Delayed|Cancelling) ;;
                Success)
                  output=$(jq -r '.StandardOutputContent' <<< "$invocation")
                  printf '%s\n' "$output"
                  origin=$(sed -n 's/^PUBLIC_HTTPS_ORIGIN=//p' <<< "$output")
                  if [[ ! "$origin" =~ ^https://([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
                    echo "SSM 출력에서 공개 HTTPS 주소를 확인할 수 없습니다." >&2
                    exit 1
                  fi
                  curl --fail --silent --show-error --max-time 10 --output /dev/null "$origin/html/index.html"
                  if ! ready=$(curl --fail --silent --show-error --max-time 10 "$origin/api/health/ready") || [[ "$ready" != READY ]]; then
                    echo "공개 HTTPS API 준비 상태 확인에 실패했습니다." >&2
                    exit 1
                  fi
                  echo '- GitHub 러너에서 HTTPS 화면과 API 응답 확인' >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
                *)
                  jq -r '.StandardOutputContent, .StandardErrorContent, .StatusDetails' <<< "$invocation"
                  exit 1
                  ;;
              esac
            elif [[ "$invocation" != *InvocationDoesNotExist* ]]; then
              printf '%s\n' "$invocation" >&2
              exit 1
            fi
            sleep 5
          done
          echo "SSM 배포 결과 확인 시간이 초과됐습니다. 명령 ID로 서버 상태를 확인하세요." >&2
          exit 1
