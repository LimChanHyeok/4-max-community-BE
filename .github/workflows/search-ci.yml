name: Search CI

on:
  pull_request:
    branches:
      - search-enhancement
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - search-enhancement
      # PR #72를 머지하기 전에 검색 EC2에서 검증할 이미지를 발행한다.
      - feature/69-search-environment

concurrency:
  group: search-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Compile, unit tests and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run tests and build JAR
        run: |
          chmod +x ./gradlew
          ./gradlew clean test bootJar --no-daemon

      - name: Prepare executable JAR
        shell: bash
        run: |
          JAR_FILE=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-plain.jar" -print -quit)
          if [ -z "$JAR_FILE" ]; then
            echo "No executable JAR found in build/libs"
            exit 1
          fi
          cp "$JAR_FILE" build/libs/app.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: community-backend:search-ci
          load: true
          cache-from: type=gha,scope=community-search-backend
          cache-to: type=gha,scope=community-search-backend,mode=max

      - name: Get AWS credentials for ECR
        if: github.event_name == 'push' && github.repository == 'LimChanHyeok/4-max-community-BE'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::929368845727:role/community-search-ci-ecr-push
          aws-region: ap-northeast-2
          role-duration-seconds: 900

      - name: Push verified image to ECR
        if: github.event_name == 'push' && github.repository == 'LimChanHyeok/4-max-community-BE'
        shell: bash
        env:
          ECR_REGISTRY: 929368845727.dkr.ecr.ap-northeast-2.amazonaws.com
          ECR_REPOSITORY: community-search-backend
        run: |
          set -euo pipefail
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          # 동일 커밋 재실행 시 이미 발행한 불변 태그를 재사용한다.
          IMAGE_COUNT=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --query 'length(images)' --output text)
          if [[ "$IMAGE_COUNT" == 0 ]]; then
            aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker tag community-backend:search-ci "$IMAGE_URI"
            docker push "$IMAGE_URI"
          else
            printf '이미 발행한 이미지를 사용합니다. %s\n' "$IMAGE_URI"
          fi

          printf 'ECR 이미지: %s\n' "$IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"


  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/search-enhancement' && github.repository == 'LimChanHyeok/4-max-community-BE'
    permissions:
      id-token: write
    uses: ./.github/workflows/search-cd.yml
    with:
      backend_sha: ${{ github.sha }}
