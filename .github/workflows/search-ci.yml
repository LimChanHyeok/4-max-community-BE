name: Search CI

on:
  pull_request:
    branches:
      - search-enhancement
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - search-enhancement

permissions:
  contents: read

concurrency:
  group: search-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile, unit tests and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run tests and build JAR
        run: |
          chmod +x ./gradlew
          ./gradlew clean test bootJar --no-daemon

      - name: Prepare executable JAR
        shell: bash
        run: |
          JAR_FILE=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-plain.jar" -print -quit)
          if [ -z "$JAR_FILE" ]; then
            echo "No executable JAR found in build/libs"
            exit 1
          fi
          cp "$JAR_FILE" build/libs/app.jar

      - name: Build Docker image
        run: docker build --platform linux/amd64 --tag community-backend:search-ci .
