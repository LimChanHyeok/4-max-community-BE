name: Main Deploy

on:
  push:
    branches:
      - main

    # Backend 실행 코드가 변경됐을 때만 이미지 Build
    # Argo CD YAML이나 values-prod.yaml Bot Commit으로는 실행하지 않음
    # 계속 workflow가 실행될 수 있기 때문!
    paths:
      - "src/**"
      - "build.gradle"
      - "build.gradle.kts"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "Dockerfile"

# 동일한 main 배포가 동시에 실행되며 values-prod.yaml을 충돌시키는 것 방지
concurrency:
  group: backend-main-deploy
  cancel-in-progress: false

permissions:
  # values-prod.yaml을 Commit하고 Push하기 위한 권한
  contents: write

  # GitHub Actions가 AWS IAM Role을 OIDC로 Assume하기 위한 권한
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 929368845727.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: community-backend

jobs:
  build-and-push:
    name: Build And Push Image
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.meta.outputs.image_tag }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: community_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
          MYSQL_ROOT_PASSWORD: rootpass

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_PROFILES_ACTIVE: test

      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: community_test
      DB_USERNAME: testuser
      DB_PASSWORD: testpass

      JWT_SECRET: test-secret-key-test-secret-key-test-secret-key-test-secret-key
      JWT_ACCESS_TOKEN_EXPIRATION: 1800000
      JWT_REFRESH_TOKEN_EXPIRATION: 1209600000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build application
        run: ./gradlew clean build --no-daemon

      - name: Prepare app.jar for Docker build
        run: |
          set -Eeuo pipefail

          JAR_FILE=$(find build/libs \
            -maxdepth 1 \
            -name "*.jar" \
            ! -name "*-plain.jar" \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No executable jar file found in build/libs"
            exit 1
          fi

          cp "$JAR_FILE" build/libs/app.jar
          ls -lh build/libs/app.jar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: meta
        run: |
          set -Eeuo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="main-${SHORT_SHA}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "IMAGE_TAG=${IMAGE_TAG}"
          echo "IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Build Docker image
        run: |
          set -Eeuo pipefail

          docker build \
            --platform linux/amd64 \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ steps.meta.outputs.image_tag }}" \
            .

      - name: Push Docker image to ECR
        run: |
          set -Eeuo pipefail

          docker push \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ steps.meta.outputs.image_tag }}"

  update-helm-values:
    name: Update Helm Image Tag
    runs-on: ubuntu-latest
    needs: build-and-push

    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
      VALUES_FILE: helm/community-backend/values-prod.yaml
      YQ_VERSION: v4.53.3

    steps:
      # Job마다 Runner가 별도로 생성되므로 다시 Checkout해야 함
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install yq
        run: |
          set -Eeuo pipefail

          curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /tmp/yq

          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

          yq --version

      - name: Update Backend image tag
        run: |
          set -Eeuo pipefail

          if [ ! -f "$VALUES_FILE" ]; then
            echo "Values file not found: $VALUES_FILE"
            exit 1
          fi

          yq -i '.image.tag = strenv(IMAGE_TAG)' "$VALUES_FILE"

          UPDATED_TAG=$(yq -r '.image.tag' "$VALUES_FILE")

          if [ "$UPDATED_TAG" != "$IMAGE_TAG" ]; then
            echo "Image tag update verification failed"
            echo "Expected: $IMAGE_TAG"
            echo "Actual:   $UPDATED_TAG"
            exit 1
          fi

          echo "Updated image tag: $UPDATED_TAG"

      - name: Validate Backend Helm Chart
        run: |
          set -Eeuo pipefail

          helm lint helm/community-backend \
            -f helm/community-backend/values-prod.yaml

          helm template community-backend \
            helm/community-backend \
            --namespace community-prod-backend \
            -f helm/community-backend/values-prod.yaml \
            > /tmp/community-backend-rendered.yaml

      - name: Commit and push Helm values
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$VALUES_FILE"

          if git diff --cached --quiet; then
            echo "No Helm values changes to commit"
            exit 0
          fi

          git commit \
            -m "chore: update backend image to ${IMAGE_TAG}"

          git push origin HEAD:main