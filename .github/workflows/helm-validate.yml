name: Helm Validate

on:
  pull_request:
    branches:
      - main
    paths:
      - "helm/community-backend/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Backend Helm Chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Lint Helm chart
        run: |
          helm lint helm/community-backend \
            -f helm/community-backend/values-prod.yaml

      - name: Render Helm chart
        run: |
          helm template community-backend \
            helm/community-backend \
            --namespace community-prod-backend \
            -f helm/community-backend/values-prod.yaml \
            > /tmp/community-backend-rendered.yaml

      - name: Verify rendered manifest
        run: |
          test -s /tmp/community-backend-rendered.yaml
          grep '^kind:' /tmp/community-backend-rendered.yaml