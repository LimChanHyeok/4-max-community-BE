# DB 연결
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate SQL 로그
logging.level.org.hibernate.SQL=info
logging.level.org.hibernate.orm.jdbc.bind=off

# JWT 서명 키
jwt.secret=${JWT_SECRET}

# JWT 만료 시간
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

# CORS 허용 출처
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}

# 쿠키 설정
app.cookie.secure=false
app.cookie.same-site=Lax

# AWS 리전
app.aws.region=${AWS_REGION:ap-northeast-2}

# S3 이미지 저장소
app.aws.s3.bucket=${APP_AWS_S3_BUCKET}

# referenceId가 null이고 updatedAt이 24시간보다 오래된 이미지만 삭제
app.image.orphan-retention-hours=24

# 고아 이미지 정리 : 매일 새벽 3시
app.image.cleanup.cron=0 0 3 * * *

# 조회수 스케줄러 동작 주기
app.view-count.flush-delay-ms=5000

# 검색 실험 환경의 DB 스키마 검증
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway가 버전별 SQL을 적용한 뒤 Hibernate가 DB 구조를 검증한다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/search
spring.flyway.validate-migration-naming=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
