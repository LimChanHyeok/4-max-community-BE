apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-backend
  namespace: community-prod-backend
  labels:
    app: community
    tier: backend
    env: prod

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  selector:
    matchLabels:
      app: community
      tier: backend
      env: prod

  template:
    metadata:
      labels:
        app: community
        tier: backend
        env: prod

    spec:
      containers:
        - name: community-backend
          image: 929368845727.dkr.ecr.ap-northeast-2.amazonaws.com/community-backend:main-56a946d
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: community-backend-configmap
            - secretRef:
                name: community-backend-secret

          resources:
            requests:
              cpu: 200m
              memory: 400Mi
            limits:
              cpu: "2"
              memory: 650Mi

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 9

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 2

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5