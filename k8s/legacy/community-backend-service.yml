apiVersion: v1
kind: Service
metadata:
  name: community-backend-service
  namespace: community-prod-backend
  labels:
    app: community
    tier: backend
    env: prod
spec:
  type: ClusterIP
  selector:
    app: community
    tier: backend
    env: prod
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http