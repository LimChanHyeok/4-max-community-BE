# Docker 내부 DNS를 사용해 백엔드 컨테이너 재생성 후 바뀐 IP도 조회한다.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream community_backend {
    zone community_backend 64k;
    server backend:8080 resolve;
    keepalive 32;
}

# 전체 처리 시간과 백엔드 응답 시간을 함께 남겨 부하 측정 시 비교한다.
log_format search '$remote_addr "$request" $status '
                  'request_time=$request_time '
                  'upstream_response_time=$upstream_response_time';

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 10m;
    access_log /dev/stdout search;
    error_log /dev/stderr warn;

    location / {
        # /posts·/auth·/health 등 기존 경로와 검색 파라미터를 그대로 전달한다.
        proxy_pass http://community_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 검색 성능의 기준 측정에 Nginx 캐시가 개입하지 않도록 한다.
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
