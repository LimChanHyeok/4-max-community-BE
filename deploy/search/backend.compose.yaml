name: community-search-backend

services:
  backend:
    # CI에서 ECR에 올릴 이미지의 고유 태그 또는 다이제스트를 전달한다.
    image: ${BACKEND_IMAGE:?ECR 백엔드 이미지 주소와 버전을 지정하세요}
    platform: linux/amd64
    container_name: community-search-backend
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: ${BACKEND_ENV_FILE:?백엔드 일반 환경설정 파일 경로를 지정하세요}
        required: true
    environment:
      SPRING_PROFILES_ACTIVE: search
      SERVER_PORT: "8080"
      # DB_PASSWORD·JWT_SECRET 파일을 Spring 설정으로 읽는다.
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
    # 호스트에 8080을 공개하지 않고 같은 Compose의 Nginx에서만 사용한다.
    expose:
      - "8080"
    secrets:
      - source: backend_db_password
        target: DB_PASSWORD
      - source: backend_jwt_secret
        target: JWT_SECRET
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8080/health/ready"]
      interval: 20s
      timeout: 5s
      start_period: 60s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  nginx:
    # 공식 안정 버전과 amd64 이미지 다이제스트를 고정한다.
    image: nginx:1.30.6-alpine@sha256:bb8f722b4be005fcd7827816a136ab779fd40185d85b5171be915cc7fc0575c7
    platform: linux/amd64
    container_name: community-search-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - ./nginx/application.inc:/etc/nginx/search/application.inc:ro
      - ./nginx/http.conf:/etc/nginx/search/server.conf:ro
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
    healthcheck:
      # Nginx를 거쳐 백엔드와 DB 연결까지 확인한다.
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1/health/ready"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  backend_db_password:
    file: ${BACKEND_DB_PASSWORD_FILE:?DB 비밀번호 파일 경로를 지정하세요}
  backend_jwt_secret:
    file: ${BACKEND_JWT_SECRET_FILE:?JWT 서명 키 파일 경로를 지정하세요}
